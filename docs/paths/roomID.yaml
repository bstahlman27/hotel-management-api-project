get:
  tags:
    - Rooms
  summary: Get a room by ID
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the room to get
  responses:
    '200':
      description: Room details
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Room.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'
put:
  tags:
    - Rooms
  summary: Update a room
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the room to update
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/Room.yaml'
  responses:
    '200':
      description: Room updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Room.yaml'
    '401':
      $ref: '../components/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../components/responses/ForbiddenError.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'
delete:
  tags:
    - Rooms
  summary: Delete a room
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the room to delete
  responses:
    '204':
      description: Room deleted
    '401':
      $ref: '../components/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../components/responses/ForbiddenError.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'

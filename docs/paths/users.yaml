get:
  summary: List all Users
  tags:
    - Users
  responses:
    '200':
      description: List of Users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/User.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/UnauthorizedError.yaml
    '403':
      $ref: ../components/responses/ForbiddenError.yaml

post:
  summary: Create a new User
  tags:
    - Users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
              example: "billy123"
            email:
              type: string
              format: email
              example: "billy123@bill.net"
            password:
              type: string
              format: password
              example: "bill123456"
          required:
            - username
            - email
            - password
  responses:
    '201':
      description: User created successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/User.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '409':
      description: Username or email already in use
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Email already in use"
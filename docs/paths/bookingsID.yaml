# /bookings/{id} endpoints
get:
  summary: Get a booking by ID
  tags:
    - Bookings
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the booking
  responses:
    '200':
      description: Booking details
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Booking.yaml'
    '401':
      $ref: '../components/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../components/responses/ForbiddenError.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'

put:
  summary: Update a booking by ID
  tags:
    - Bookings
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the booking to update
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            room_id:
              type: integer
              example: 2
            check_in:
              type: string
              format: date-time
              example: '2025-12-01T15:00:00Z'
            check_out:
              type: string
              format: date-time
              example: '2025-12-05T11:00:00Z'
            total_price:
              type: number
              format: float
              example: 500.0
            status:
              type: string
              example: 'CONFIRMED'
          required: []
  responses:
    '200':
      description: Booking updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Booking.yaml'
    '401':
      $ref: '../components/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../components/responses/ForbiddenError.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'

delete:
  summary: Delete a booking by ID
  tags:
    - Bookings
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      schema:
        type: integer
      required: true
      description: Numeric ID of the booking to delete
  responses:
    '204':
      description: Booking deleted successfully
    '401':
      $ref: '../components/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../components/responses/ForbiddenError.yaml'
    '404':
      $ref: '../components/responses/NotFoundError.yaml'
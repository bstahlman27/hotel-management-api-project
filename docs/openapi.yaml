openapi: '3.1.0'
info:
  title: Hotel Mangement System
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://hotel-management-api-project.onrender.com
    description: Render deployment
tags:
  - name: Authentication
    descripion: Login-related endpoints
  - name: Users
    description: User-related endpoints
paths:

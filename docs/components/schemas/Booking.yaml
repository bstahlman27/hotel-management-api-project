type: object
properties:
  id:
    type: integer
    readOnly: true
    example: 1
  user_id:
    type: integer
    example: 1
  room_id:
    type: integer
    example: 2
  check_in:
    type: string
    format: date-time
    example: '2025-12-01T15:00:00Z'
  check_out:
    type: string
    format: date-time
    example: '2025-12-05T11:00:00Z'
  total_price:
    type: number
    format: float
    example: 500.0
  status:
    type: string
    example: 'PENDING'
required:
  - user_id
  - room_id
  - check_in
  - check_out
  - total_price
  - status
